[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-pulse"
version = "1.1.0"
authors = [
  { name = "Luca Celebrano", email = "luca.celebrano1@gmail.com" },
]
description = "Real-Time Biomedical Literature & Preprint Intelligence CLI with Automated Clinical Entity Extraction"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = [
  "bioinformatics",
  "pubmed",
  "biorxiv",
  "medrxiv",
  "literature-mining",
  "oncology",
  "clinical-research",
  "cli"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
"Homepage" = "https://github.com/Lukecele/paper-pulse"
"Bug Tracker" = "https://github.com/Lukecele/paper-pulse/issues"
"Author Profile" = "https://github.com/Lukecele"

[project.scripts]
paper-pulse = "paper_pulse.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["paper_pulse*"]
